# FILENAME: env-local/docker-compose.yml

services:
    postgres:
        image: postgres:16
        container_name: homeledger-db
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: homeledger_db
        ports:
            - "5432:5432"
        volumes:
            - ./data/postgres:/var/lib/postgresql/data
            - ./postgres-init:/docker-entrypoint-initdb.d:ro
        restart: unless-stopped

    keycloak:
        image: quay.io/keycloak/keycloak:latest
        container_name: keycloak
        command:
            - start-dev
        environment:
            KEYCLOAK_ADMIN: admin
            KEYCLOAK_ADMIN_PASSWORD: admin
            KC_HOSTNAME: "auth.mac-perso-ora.test"
            KC_HOSTNAME_STRICT: "true"
            KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/auth.mac-perso-ora.test.pem
            KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/auth.mac-perso-ora.test-key.pem
            KC_HTTP_ENABLED: "false"
        ports:
            - "8443:8443"
        volumes:
            - ./data/keycloak:/opt/keycloak/data
            - ../certificates:/opt/keycloak/certs:ro
        depends_on:
            - postgres
        restart: unless-stopped
